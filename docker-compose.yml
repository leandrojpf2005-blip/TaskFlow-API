# Runs three containers together: your Postgres DB, your FastAPI app and the web app (nginx).
# Compose auto-reads a .env file in this folder for the ${...} values below,
# so your existing .env (DB_PASSWORD, JWT_SECRET) is reused — no duplication.

services:
  db:
    image: postgres:18
    # 1 GB of cache (default 128 MB) so the whole food table and its search
    # index stay in memory — the first search of the day is as fast as the rest.
    command: postgres -c shared_buffers=1GB
    shm_size: 256mb          # Docker's default (64 MB) is too small for bigger Postgres queries
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Named volume = your data survives container restarts/rebuilds.
      # postgres:18+ wants the mount at /var/lib/postgresql (not /data).
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"          # exposes DB to your host (so you can psql into it)
    healthcheck:
      # Don't let the app start until Postgres is actually ACCEPTING connections.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .                 # build the image from the Dockerfile in this folder
    environment:
      DB_NAME: taskflow
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db            # <-- the SERVICE NAME, not localhost! (see note below)
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"          # your app reachable at http://localhost:8000
    depends_on:
      db:
        condition: service_healthy   # waits for the healthcheck above to pass

  web:
    build: ./taskflow-frontend   # React app built and served by nginx (see its Dockerfile)
    ports:
      - "8080:80"            # the app at http://<server>:8080 — its /api/... is forwarded to "app"
    depends_on:
      - app

volumes:
  pgdata:
