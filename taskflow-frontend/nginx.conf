server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/... goes to FastAPI (the "app" service in docker-compose), with the
    # /api prefix removed: /api/foods?q=banana -> http://app:8000/foods?q=banana
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build files have a hash in their name, so they never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The page itself and the service worker must always be checked again,
    # otherwise phones keep running the old version after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any other path gets index.html and React takes over.
    location / {
        try_files $uri /index.html;
    }
}
